name: testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hub
        run: cd hub && npm test
      - name: Agente
        run: python3 -m unittest discover -s test/agent -v
      - name: Agente em Python 3.6 (sintaxe)
        run: docker run --rm -v "$PWD/agent:/a" python:3.6-slim python -m py_compile /a/linux-control-agent.py

services:
  hub:
    build: .
    container_name: linux-control
    restart: unless-stopped
    ports:
      - "7420:7420"
    environment:
      LCTL_ADMIN_PASSWORD: ${LCTL_ADMIN_PASSWORD:-}
      LCTL_PUBLIC_URL: ${LCTL_PUBLIC_URL:-}
      LCTL_RETENTION_DAYS: ${LCTL_RETENTION_DAYS:-7}
      LCTL_TRUST_PROXY: ${LCTL_TRUST_PROXY:-0}
    volumes:
      - lctl-data:/data
volumes:
  lctl-data:
